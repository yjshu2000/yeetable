<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Yeetable</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="assets/icon-yeetable.svg" type="image/svg+xml">
<meta name="theme-color" content="#12141a">
</head>
<body>

<div id="hud">
  <div class="hud-stats">
    <div class="hud-stat">
      <div class="k">Score</div>
      <div class="v" id="score">0</div>
    </div>
    <div class="hud-stat">
      <div class="k">Best</div>
      <div class="v" id="best">0</div>
    </div>
  </div>
  <div class="hud-actions">
    <button id="pause">Pause</button>
  </div>
</div>

<canvas id="board"></canvas>

<div id="menuwrap">
  <div class="menu-row">
    <div class="menu-slot">
      <div class="menu-col" id="morecol" hidden>
        <div class="confirm-pair">
          <button id="newgame" type="button">New Game</button>
          <button id="confirmnew" type="button" hidden>Confirm?</button>
        </div>
        <button id="savenow" type="button">Save Now</button>
        <div class="board-pick">
          <button id="boardbtn" type="button" tabindex="-1">Go To Board &#9662;</button>
          <select id="boardsel" aria-label="Board size"></select>
        </div>
        <button id="blurtoggle" type="button">Pause when unfocused</button>
      </div>
      <button id="moreopts" type="button">More Options</button>
    </div>
    <div class="menu-slot">
      <div class="menu-panel" id="soundpanel" hidden>
        <button type="button">WIP</button>
      </div>
      <button id="soundbtn" type="button" hidden>Sound Menu</button>
    </div>
    <div class="menu-slot">
      <div class="menu-panel stats-panel" id="statspanel" hidden>
        <div class="stat-row" id="row-escaped" hidden><span>Escaped balls</span><output id="st-escaped"></output></div>
        <div class="stat-row"><span>Total ball area</span><output id="st-area"></output></div>
        <div class="stat-row"><span>% of table area</span><output id="st-pct"></output></div>
      </div>
      <button id="statsbtn" type="button" hidden>Stats</button>
    </div>
  </div>
</div>

<div id="confirmveil" hidden></div>

<div id="autowrap">
  <div id="idlemenu" class="popmenu" hidden>
    <div class="speed">
      <div class="speed-head">
        <span>Launch every</span>
        <output id="idleout"></output>
      </div>
      <div id="idletrack">
        <div id="idlefill"></div>
        <div class="thumb" id="thumbidle"></div>
      </div>
    </div>
  </div>
  <div id="automenu" class="popmenu" hidden>
    <button class="opt" type="button" data-opt="disableUntilOut"><span class="mark"></span>Disable until ball out</button>
    <button class="opt" type="button" data-opt="showWhenHidden"><span class="mark"></span>Show when UI hidden</button>
    <button class="opt" type="button" data-opt="infiniteBalls"><span class="mark"></span>Infinite Balls</button>
    <div class="speed">
      <div class="speed-head">
        <span>Launch speed</span>
        <output id="speedout"></output>
      </div>
      <div id="speedtrack">
        <div id="speedfill"></div>
        <div class="thumb" id="thumbmin"></div>
        <div class="thumb" id="thumbmax"></div>
      </div>
      <div class="speed-head">
        <span>Flat angles blocked</span>
        <output id="bandout"></output>
      </div>
      <div id="bandtrack">
        <div id="bandfill"></div>
        <div class="thumb" id="thumbband"></div>
      </div>
    </div>
  </div>
  <button id="idle">Idle</button>
  <button id="auto">Auto</button>
</div>

<div id="eyewrap">
  <button id="eye" type="button" aria-label="Hide interface">
    <svg id="icon-hide" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
      <circle cx="12" cy="12" r="3.2"/>
      <line x1="3.5" y1="20.5" x2="20.5" y2="3.5"/>
    </svg>
    <svg id="icon-show" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/>
      <circle cx="12" cy="12" r="3.2"/>
    </svg>
  </button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="yeetable.js"></script>
</body>
</html>
